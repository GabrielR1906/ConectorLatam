# Clave única del proyecto en SonarQube/SonarCloud
sonar.projectKey=conectorlatam
sonar.projectName=ConectorLatam
sonar.organization=gabrielr1906

# Directorios a analizar (frontend y backend)
sonar.sources=frontend-react/src,backend

# Excluir archivos que no necesitan análisis de código
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/__pycache__/**,**/*.test.js,**/*.spec.js

# Lenguajes principales del proyecto
sonar.language=js,py

# Configuración específica de Python
sonar.python.version=3.11

# Configuración específica de JavaScript/React
sonar.javascript.environments=browser,node
